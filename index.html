<body data-page="home">

<header id="site-header"></header>

<main id="main">

  <!-- Hero -->
  <section class="hero">
    <div class="wrap hero-inner">
      <div>
        <span class="eyebrow"><span class="pulse"></span><span id="heroRole">—</span></span>
        <h1 id="heroName">Emre Biltekin</h1>
        <p class="lead" id="heroTagline"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="/projects.html"><span data-i18n="nav.projects"></span></a>
          <a class="btn btn-ghost" href="/about.html"><span data-i18n="nav.about"></span></a>
        </div>
      </div>
      <div class="avatar-frame" id="heroAvatar"></div>
    </div>
  </section>

  <!-- One cikan projeler -->
  <section class="section-tight">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-i18n="home.featured.title"></h2>
          <p data-i18n="home.featured.desc"></p>
        </div>
        <a class="link-more" href="/projects.html"><span data-i18n="home.featured.all"></span> →</a>
      </div>
      <div class="grid" id="featuredProjects">
        <div class="loading" data-i18n="common.loading"></div>
      </div>
    </div>
  </section>

  <!-- Son yazilar -->
  <section class="section-tight">
    <div class="wrap">
      <div class="section-head">
        <div>
          <h2 data-i18n="home.latest.title"></h2>
          <p data-i18n="home.latest.desc"></p>
        </div>
        <a class="link-more" href="/blog.html"><span data-i18n="home.latest.all"></span> →</a>
      </div>
      <ul class="post-list" id="latestPosts">
        <li class="loading" data-i18n="common.loading"></li>
      </ul>
    </div>
  </section>

</main>

<footer id="site-footer"></footer>
